version = 1

# REUSE (https://reuse.software) machine-readable licensing for the whole repo.
#
# Licensing is declared here in the manifest rather than as per-file inline
# headers: the project's comment-guard lint caps stacked `//` comment blocks, so
# a two-line SPDX header prepended above an existing top-of-file comment would
# trip it. REUSE explicitly supports manifest-based annotation, so every file —
# Rust sources, documentation, configuration, workflows, scripts, binary assets,
# and the byte-exact `.golden` test fixtures — is covered here instead.
#
# The repository is the project's own work under the MIT licence, except the
# MPEG audio ISO reference tables under src/mux/codec/testdata/dist10, which are
# third-party test data and carry their own annotation at the end of this file.

[[annotations]]
path = [
    "**/*.rs",
    "**/*.md",
    "**/*.toml",
    "**/*.lock",
    "**/*.yml",
    "**/*.yaml",
    "**/*.json",
    "**/*.sh",
    "**/*.py",
    "**/*.ps1",
    "**/*.golden",
    "**/*.svg",
    "**/*.png",
    "**/*.ico",
    "**/*.plist",
    "**/*.manifest",
    "**/.gitignore",
    ".gitignore",
    "Makefile",
    "LICENSE",
    "build.rs",
    "**/*.c",
    "**/*.mp2",
    "**/*.class",
    "**/PROVENANCE",
    "tests/*.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Matthew Jackson & Contributors"
SPDX-License-Identifier = "MIT"

# Table 3-B.2a-d allocation data copied from the ISO/IEC 11172-5 reference
# software (dist10, ISO/MPEG Audio Subgroup Software Simulation Group); this is
# not the project's work and is not MIT-licensed.
[[annotations]]
path = "src/mux/codec/testdata/dist10/alloc_*"
precedence = "aggregate"
SPDX-FileCopyrightText = "ISO/IEC JTC1/SC29/WG11 (MPEG) and the ISO/MPEG Audio Subgroup Software Simulation Group"
SPDX-License-Identifier = "LicenseRef-ISO-dist10"
