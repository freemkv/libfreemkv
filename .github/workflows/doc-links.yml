name: doc-links

# Thin caller → the canonical reusable doc-links gate in freemkv/.github.
# libfreemkv deps freemkv-unlock by version (git-tag override), so the reusable
# checks it out as a sibling and path-patches it, and resolves the toolchain
# from rust-version.
on:
  push:
    # A docs-only push runs nothing heavy: promote and the release gate fall back to
    # the last commit this ran on (see their docs_base).
    paths-ignore: ['.github/release-notes/**', '.github/ISSUE_TEMPLATE/**', '.github/QA.md', 'CHANGELOG.md', 'CONTRIBUTING.md', 'CODE_OF_CONDUCT.md', 'GOVERNANCE.md', 'ROADMAP.md', 'RELEASE.md', 'TROUBLESHOOTING.md', 'fuzz/README.md']
    branches: [dev]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doc-links:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: freemkv/.github/.github/workflows/guard-doclinks.yml@v1
    with:
      self: libfreemkv
      checkout: freemkv-unlock
      patch: freemkv-unlock
