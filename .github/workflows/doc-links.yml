name: doc-links

# Thin caller → the canonical reusable doc-links gate in freemkv/.github.
# libfreemkv deps freemkv-unlock by version (git-tag override), so the reusable
# checks it out as a sibling and path-patches it, and resolves the toolchain
# from rust-version.
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doc-links:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: freemkv/.github/.github/workflows/guard-doclinks.yml@v1
    with:
      self: libfreemkv
      checkout: freemkv-unlock
      patch: freemkv-unlock
